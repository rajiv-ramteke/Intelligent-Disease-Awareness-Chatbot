<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthBot Pro - Welcome</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .landing-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            padding: 20px;
        }
        .landing-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 3rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .landing-logo {
            font-size: 3rem;
            color: var(--secondary);
            margin-bottom: 1rem;
        }
        .landing-title {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            font-family: 'Outfit', sans-serif;
        }
        .landing-subtitle {
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            font-size: 1.1rem;
        }
        .auth-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn-landing {
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
        }
        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.6);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        .btn-guest {
            background: transparent;
            color: var(--text-muted);
            font-weight: 400;
        }
        .btn-guest:hover {
            color: white;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="landing-container">
        <div class="landing-card">
            <div class="landing-logo">
                <i class="fas fa-heartbeat"></i>
            </div>
            <h1 class="landing-title">HealthBot <span class="pro-badge">PRO</span></h1>
            <p class="landing-subtitle">Your intelligent AI healthcare assistant.</p>
            
            <div class="auth-buttons">
                <a href="/login" class="btn-landing btn-primary"><i class="fas fa-sign-in-alt"></i> Login</a>
                <a href="/register" class="btn-landing btn-secondary"><i class="fas fa-user-plus"></i> Create Account</a>
                <a href="/chat" class="btn-landing btn-guest">Continue as Guest <i class="fas fa-arrow-right"></i></a>
            </div>
        </div>
    </div>
</body>
</html>

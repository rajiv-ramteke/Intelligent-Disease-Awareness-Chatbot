<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthBot Pro - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .admin-container { padding: 3rem; max-width: 1200px; margin: 0 auto; width: 100%; overflow-y: auto;}
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
        .stat-card { background: var(--bg-panel); border: 1px solid var(--glass-border); padding: 2rem; border-radius: 15px; text-align: center; }
        .stat-card h3 { color: var(--text-muted); font-size: 1rem; margin-bottom: 10px; }
        .stat-card .value { font-size: 3rem; font-weight: bold; color: var(--primary); font-family: 'Outfit', sans-serif;}
        .danger .value { color: var(--danger); }
        .success .value { color: var(--secondary); font-size: 2rem; }
    </style>
</head>
<body>
    <div class="admin-container">
        <h1><i class="fas fa-shield-alt"></i> HealthBot Pro Admin Dashboard</h1>
        <p style="color: var(--text-muted); margin-top: 5px;">Monitor application metrics and emergency alerts</p>
        
        <div class="stats-grid" id="stats-grid">
            <div class="stat-card">
                <h3>Loading Stats...</h3>
            </div>
        </div>
    </div>

    <script>
        async function fetchStats() {
            try {
                const response = await fetch('/admin/stats');
                const data = await response.json();
                
                document.getElementById('stats-grid').innerHTML = `
                    <div class="stat-card">
                        <h3>Total Conversations</h3>
                        <div class="value">${data.total_conversations}</div>
                    </div>
                    <div class="stat-card danger">
                        <h3>Emergency Alerts</h3>
                        <div class="value">${data.emergency_alerts}</div>
                    </div>
                    <div class="stat-card success">
                        <h3>API Status</h3>
                        <div class="value">${data.api_status}</div>
                    </div>
                `;
            } catch (e) {
                document.getElementById('stats-grid').innerHTML = '<p style="color:red">Failed to load stats</p>';
            }
        }
        
        document.addEventListener('DOMContentLoaded', fetchStats);
        setInterval(fetchStats, 10000); // Refresh every 10s
    </script>
</body>
</html>
